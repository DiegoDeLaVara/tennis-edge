<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tennis Edge">
<link rel="manifest" href="manifest.webmanifest">
<title>Tennis Edge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23c8e64a'/%3E%3Cpath d='M10 20c14 6 14 18 0 24M54 20c-14 6-14 18 0 24' stroke='%23fff' stroke-width='4' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3f5f0; --card: #ffffff; --card2: #eef1ea; --ink: #13201a; --mute: #63736a; --line: #dbe2d8;
  --ball: #9db51f; --ball-ink: #4f5e00; --good: #17834a; --good-soft: #def2e5; --bad: #c0392b; --bad-soft: #f8e1de;
  --warn: #a86400; --warn-soft: #fbedd5; --sharp: #6a3fc8; --sharp-soft: #ece4fb; --a: #c26a12; --b: #1f6f8b;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 6px 18px -10px rgba(0,0,0,.25);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1410; --card: #142019; --card2: #1a2920; --ink: #e7efe9; --mute: #8fa298; --line: #24352b;
    --ball: #c8e64a; --ball-ink: #c8e64a; --good: #4fd18b; --good-soft: #143222; --bad: #ff7b6e; --bad-soft: #3a1a17;
    --warn: #f2b84b; --warn-soft: #382a10; --sharp: #b79bff; --sharp-soft: #261d3f; --a: #f0a050; --b: #5fbfdf;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"] {
  --bg: #0c1410; --card: #142019; --card2: #1a2920; --ink: #e7efe9; --mute: #8fa298; --line: #24352b;
  --ball: #c8e64a; --ball-ink: #c8e64a; --good: #4fd18b; --good-soft: #143222; --bad: #ff7b6e; --bad-soft: #3a1a17;
  --warn: #f2b84b; --warn-soft: #382a10; --sharp: #b79bff; --sharp-soft: #261d3f; --a: #f0a050; --b: #5fbfdf;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.7);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 "Inter Tight", system-ui, -apple-system, Segoe UI, sans-serif; -webkit-font-smoothing: antialiased; }
.mono, .num { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 820px; margin: 0 auto; padding: 0 max(14px, env(safe-area-inset-left)) calc(84px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-right)); }
header.top { position: sticky; top: 0; z-index: 10; background: var(--bg); padding: calc(10px + env(safe-area-inset-top)) 0 8px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand h1 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
.brand h1 i { width: 18px; height: 18px; border-radius: 50%; background: var(--ball); display: inline-block; box-shadow: inset -3px -3px 0 rgba(0,0,0,.12); }
.upd { font-size: 12px; color: var(--mute); text-align: right; }
.upd b { color: var(--ink); font-weight: 600; }
.filters { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--mute); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: var(--card); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); }
nav.tabs button { flex: 1; max-width: 160px; background: none; border: 0; padding: 9px 4px 10px; font-size: 11.5px; font-weight: 600; color: var(--mute); display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-selected="true"] { color: var(--ink); }
nav.tabs button[aria-selected="true"] svg { color: var(--ball-ink); }
h2.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--mute); margin: 22px 2px 8px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
h2.sec span { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.list > * + * { border-top: 1px solid var(--line); }
.note { font-size: 12.5px; color: var(--mute); }
.callout { background: var(--card2); border-radius: 12px; padding: 10px 12px; font-size: 13px; color: var(--ink); margin-top: 10px; }
.callout b { font-weight: 700; }
.empty { padding: 26px 14px; text-align: center; color: var(--mute); font-size: 14px; }

/* pick cards */
.pick { padding: 12px 13px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; }
.pick .what { font-weight: 700; font-size: 16.5px; letter-spacing: -.01em; }
.pick .sub { font-size: 12.5px; color: var(--mute); }
.pick .right { text-align: right; }
.pick.take { border-left: 4px solid var(--good); }
.takechip { display: inline-block; font: 800 11px/1 "Inter Tight", sans-serif; letter-spacing: .06em; background: var(--good); color: var(--card); border-radius: 6px; padding: 4px 6px; margin-right: 7px; vertical-align: 2px; }
.pick .units { font: 700 22px/1 "JetBrains Mono", monospace; color: var(--good); }
.pick .units small { font-size: 12px; font-weight: 600; }
.pick .ev { font-size: 12px; color: var(--good); font-weight: 600; }
.pick .row2 { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.badge { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--card2); color: var(--mute); white-space: nowrap; }
.badge.good { background: var(--good-soft); color: var(--good); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.sharp { background: var(--sharp-soft); color: var(--sharp); }
.badge.live { background: var(--bad); color: #fff; }
.btn { border: 1px solid var(--line); background: var(--card2); border-radius: 9px; padding: 6px 11px; font-size: 13px; font-weight: 700; cursor: pointer; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.small { padding: 3px 9px; font-size: 12px; }
.btn:disabled { opacity: .45; }

/* match rows */
.mrow { padding: 10px 12px; cursor: pointer; display: grid; grid-template-columns: 48px minmax(0, 1fr) 92px; gap: 10px; align-items: center; width: 100%; text-align: left; background: none; border: 0; }
.mrow .t { font: 600 13px/1.15 "JetBrains Mono", monospace; color: var(--mute); }
.mrow .t small { display: block; font-size: 10.5px; }
.who { display: grid; gap: 1px; min-width: 0; }
.who div { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.who .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; }
.who .fav .nm { font-weight: 700; }
.who .pp { font: 600 12.5px "JetBrains Mono", monospace; flex: none; }
.mtags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
.mtags .badge { font-size: 10.5px; padding: 1px 6px; }
.edgecol { text-align: right; }
.edgecol b { display: block; font: 700 15px "JetBrains Mono", monospace; }
.edgecol span { font-size: 11px; color: var(--mute); }
.bar2 { display: flex; height: 5px; border-radius: 3px; overflow: hidden; margin-top: 5px; background: var(--card2); }
.bar2 i:first-child { background: var(--a); } .bar2 i:last-child { background: var(--b); }
.mk { position: relative; height: 0; }
.mk i { position: absolute; top: -8px; width: 2px; height: 11px; background: var(--ink); border-radius: 1px; }
.detail { padding: 2px 12px 14px; display: grid; gap: 14px; border-top: 1px dashed var(--line); }
.detail h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--mute); margin: 10px 0 6px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 520px) { .two { grid-template-columns: 1fr; } }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 4px 14px; }
.kv div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding: 3px 0; font-size: 13.5px; }
.kv span { color: var(--mute); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-size: 11px; color: var(--mute); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tw { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.pos { color: var(--good); font-weight: 700; } .neg { color: var(--bad); }
.form { display: flex; gap: 3px; flex-wrap: wrap; }
.form i { width: 18px; height: 18px; border-radius: 4px; font: 700 10.5px/18px "JetBrains Mono", monospace; text-align: center; color: #fff; font-style: normal; }
.form i.W { background: var(--good); } .form i.L { background: var(--bad); }
.pcard { background: var(--card2); border-radius: 10px; padding: 10px; }
.pcard h4 { margin: 0 0 6px; font-size: 15px; }
.pcard.a h4 { color: var(--a); } .pcard.b h4 { color: var(--b); }
.sig { border-left: 3px solid var(--sharp); background: var(--sharp-soft); border-radius: 0 8px 8px 0; padding: 6px 10px; font-size: 13px; }
.sig + .sig { margin-top: 6px; }
.hist { display: flex; align-items: flex-end; gap: 2px; height: 70px; }
.hist div { flex: 1; background: var(--ball); border-radius: 2px 2px 0 0; min-height: 1px; position: relative; }
.hist div.line { background: var(--warn); }
.histx { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--mute); font-family: "JetBrains Mono", monospace; }

/* live calc */
.calc { display: grid; gap: 8px; }
.calc .rowc { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
.calc .rowc label { min-width: 74px; color: var(--mute); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
.step { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.step button { border: 0; background: var(--card2); width: 30px; height: 30px; font-size: 16px; cursor: pointer; }
.step span { min-width: 30px; text-align: center; font-family: "JetBrains Mono", monospace; font-weight: 600; }
.seg2 { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg2 button { border: 0; background: var(--card); padding: 5px 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--mute); }
.seg2 button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.bigp { font: 800 30px/1 "JetBrains Mono", monospace; }

/* tracker */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.stat small { display: block; font-size: 11px; color: var(--mute); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.stat b { font: 700 21px/1.2 "JetBrains Mono", monospace; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; padding: 12px; }
.form-grid label { display: grid; gap: 3px; font-size: 11.5px; color: var(--mute); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.form-grid input, .form-grid select { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 7px 9px; font-size: 15px; text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--ink); width: 100%; }
.bet { padding: 10px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; }
.bet .what { font-weight: 700; }
.bet .sub { font-size: 12px; color: var(--mute); }
.bet .res { text-align: right; font-family: "JetBrains Mono", monospace; font-weight: 700; }
.bet .acts { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
svg.chart { width: 100%; height: 140px; display: block; }
dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--ink); padding: 0; width: min(520px, calc(100vw - 24px)); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog header { padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
.search { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 11px; margin-top: 8px; font-size: 15px; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--ball-ink); outline-offset: 2px; }
</style>
</head>
<body>
<header class="top"><div class="wrap" style="padding-bottom:0">
  <div class="brand"><h1><i></i>Tennis Edge</h1><div class="upd" id="upd">Loading&hellip;</div></div>
  <div class="filters" id="filters"></div>
</div></header>
<main class="wrap" id="main"></main>
<nav class="tabs" role="tablist">
  <button data-tab="picks" role="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21l1.5-7L2 9.3l7-.8z"/></svg>Picks</button>
  <button data-tab="board" role="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M4.5 7.5c5 2.5 5 6.5 0 9M19.5 7.5c-5 2.5-5 6.5 0 9"/></svg>Matches</button>
  <button data-tab="books" role="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M8 4v16"/></svg>Books</button>
  <button data-tab="tracker" role="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>My bets</button>
  <button data-tab="record" role="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Model record</button>
  <button data-tab="guide" role="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>How</button>
</nav>

<dialog id="dlg"><header><span id="dlg-title">Log a bet</span><button class="btn small" id="dlg-x">Close</button></header><div id="dlg-body"></div></dialog>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (p, d = 0) => p == null ? "—" : (p * 100).toFixed(d) + "%";
const cents = p => p == null ? "—" : Math.round(p * 100) + "¢";
const sgn = (x, d = 1) => x == null ? "—" : (x >= 0 ? "+" : "") + (x * 100).toFixed(d) + "%";
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const fee = p => 0.07 * p * (1 - p);
let B = null;                         // board.json
let SB = null;                        // sportsbook.json (all-sports line shopping)
const S = { tab: store.get("te_tab", "picks"), f: store.get("te_filter", "all"), q: "", open: new Set() };

// ------------------------------------------------------------- tennis maths (same as the Python engine)
function hold(p) { const q = 1 - p, deuce = p * p / (p * p + q * q); return p ** 4 * (1 + 4 * q + 10 * q * q) + 20 * p ** 3 * q ** 3 * deuce; }
function gameFrom(p, a, b) {           // server wins game from a-b points (0..)
  if (a >= 4 && a - b >= 2) return 1; if (b >= 4 && b - a >= 2) return 0;
  if (a >= 3 && b >= 3) { const q = 1 - p, d = p * p / (p * p + q * q); if (a === b) return d; return a > b ? p + (1 - p) * d : p * d; }
  return p * gameFrom(p, a + 1, b) + (1 - p) * gameFrom(p, a, b + 1);
}
function tbFrom(pa, pb, a, b, aServing) {   // A wins tiebreak from a-b with A serving the next point
  const memo = new Map();
  function f(a, b, aSrv, k) {               // k: points served so far by current server in this turn (0/1)
    if (a >= 7 && a - b >= 2) return 1; if (b >= 7 && b - a >= 2) return 0;
    if (a >= 6 && b >= 6 && a === b) { const w = pa * (1 - pb), l = (1 - pa) * pb; return w / (w + l); }
    const key = a + "," + b + "," + aSrv + "," + k; if (memo.has(key)) return memo.get(key);
    const p = aSrv ? pa : 1 - pb;
    const nk = k + 1, swap = nk >= 2;
    const ns = swap ? !aSrv : aSrv, nk2 = swap ? 0 : nk;
    const v = p * f(a + 1, b, ns, nk2) + (1 - p) * f(a, b + 1, ns, nk2);
    memo.set(key, v); return v;
  }
  const n = a + b, k0 = n === 0 ? 1 : ((n - 1) % 2);  // first point is a single serve, then pairs
  return f(a, b, aServing, n === 0 ? 1 : k0);
}
function setFrom(pa, pb, ga, gb, aServing, memo = new Map()) {   // A wins set from ga-gb, A serving next game
  if (ga >= 6 && ga - gb >= 2 || ga === 7) return 1; if (gb >= 6 && gb - ga >= 2 || gb === 7) return 0;
  if (ga === 6 && gb === 6) return tbFrom(pa, pb, 0, 0, aServing);
  const key = ga + "," + gb + "," + aServing; if (memo.has(key)) return memo.get(key);
  const w = aServing ? hold(pa) : 1 - hold(pb);
  const v = w * setFrom(pa, pb, ga + 1, gb, !aServing, memo) + (1 - w) * setFrom(pa, pb, ga, gb + 1, !aServing, memo);
  memo.set(key, v); return v;
}
function matchFrom(pa, pb, bo, sa, sb, s) {   // s: probability A wins any future set (averaged over serve)
  const need = Math.ceil(bo / 2);
  if (sa >= need) return 1; if (sb >= need) return 0;
  return s * matchFrom(pa, pb, bo, sa + 1, sb, s) + (1 - s) * matchFrom(pa, pb, bo, sa, sb + 1, s);
}
function liveProb(pa, pb, bo, st) {
  // st: {sa, sb, ga, gb, pa_, pb_ (points), srv: 0 = A serving, tb: bool}
  const sFuture = (setFrom(pa, pb, 0, 0, true) + setFrom(pa, pb, 0, 0, false)) / 2;
  const aSrv = st.srv === 0;
  let pSet;
  if (st.tb) pSet = tbFrom(pa, pb, st.pa_, st.pb_, aSrv);
  else {
    const g = aSrv ? gameFrom(pa, st.pa_, st.pb_) : 1 - gameFrom(pb, st.pb_, st.pa_);
    pSet = g * setFrom(pa, pb, st.ga + 1, st.gb, !aSrv) + (1 - g) * setFrom(pa, pb, st.ga, st.gb + 1, !aSrv);
  }
  return pSet * matchFrom(pa, pb, bo, st.sa + 1, st.sb, sFuture) + (1 - pSet) * matchFrom(pa, pb, bo, st.sa, st.sb + 1, sFuture);
}

// ------------------------------------------------------------- helpers
const when = t => { const d = new Date(t * 1000); return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); };
const dayOf = t => { const d = new Date(t * 1000), n = new Date(); const dd = Math.round((new Date(d.toDateString()) - new Date(n.toDateString())) / 864e5);
  return dd === 0 ? "Today" : dd === 1 ? "Tomorrow" : dd === -1 ? "Yesterday" : d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }); };
const ago = t => { const m = Math.round((Date.now() / 1000 - t) / 60); return m < 1 ? "just now" : m < 60 ? m + " min ago" : Math.round(m / 60) + " h ago"; };
const levelName = { G: "Slam", M: "1000", A: "Tour", F: "Finals", C: "Chall", S: "ITF", Q: "Qual" };
const surfColor = { Hard: "#3b6ea8", Clay: "#c0602c", Grass: "#3d8a4e", Carpet: "#7a5c8c" };

function valueParlays(picks, now) {
  // Parlays built ONLY from TAKE legs (each already +EV), one leg per match. Edges multiply, and so do payouts.
  // 15-year test: favourite parlays lost 4-8% (the margin compounds); parlays of +EV legs made +9% (2 legs) / +15% (3 legs).
  const S = B.config.strategies;
  const best = {};
  picks.filter(x => x.units > 0 && x.start > now + 600 && x.ask > 0.03 && x.ask < 0.97).forEach(x => {
    const c = x.ask + fee(x.ask), q = Math.min(0.99, (1 + x.ev) * c);
    if (!(q > c)) return;
    if (!best[x.match] || x.ev > best[x.match].ev) best[x.match] = { ...x, q, c };
  });
  const legs = Object.values(best).sort((a, b) => b.ev - a.ev).slice(0, 10);
  if (legs.length < 2) return `<h2 class="sec">💥 Value parlays <span>built only from TAKE legs</span></h2><div class="card empty">Need at least two TAKE bets on different matches to build a value parlay. Check back after the next refresh.</div>`;
  const out = [];
  const pick = (k, start, cur) => {
    if (cur.length === k) { out.push(cur.slice()); return; }
    for (let i = start; i < legs.length; i++) { cur.push(legs[i]); pick(k, i + 1, cur); cur.pop(); }
  };
  [2, 3, 4].forEach(k => pick(k, 0, []));
  const rows = out.map(L => {
    const Q = L.reduce((a, x) => a * x.q, 1), C = L.reduce((a, x) => a * x.c, 1);
    let take = Q / 1.03;                                   // highest combo price that still leaves a 3% edge after the fee
    for (let i = 0; i < 30; i++) take = Q / 1.03 - fee(take);
    return { L, Q, C, ev: Q / C - 1, take, pays: 1 / (take + fee(take)) };
  }).filter(r => r.ev > 0.03 && r.take > 0.02);
  if (!rows.length) return "";
  const byEV = rows.slice().sort((a, b) => b.ev - a.ev).slice(0, 4);
  const byPay = rows.filter(r => !byEV.includes(r)).sort((a, b) => b.pays - a.pays).slice(0, 3);
  const units = n => n === 2 ? 0.5 : n === 3 ? 0.25 : 0.1;
  const card = r => `<div class="pick">
      <div><div class="what">${r.L.length}-leg parlay · pays ~${r.pays.toFixed(1)}x</div>
        <div class="sub">${r.L.map(x => `${esc(x.label.replace(" to win", ""))} <span class="note">(${cents(x.ask)}, ${esc(S[(x.tags || []).find(t => (S[t]?.kelly_mult || 0) > 0)]?.label || "")})</span>`).join(" + ")}</div></div>
      <div class="right"><div class="units">${units(r.L.length)}<small>u</small></div><div class="note">$${(units(r.L.length) * unitVal()).toFixed(0)}</div></div>
      <div class="row2"><span class="badge good">${sgn(r.ev)} EV</span><span class="badge">hits ${pct(r.Q, 1)}</span><span class="badge warn">take ≤ ${Math.floor(r.take * 100)}¢</span>
        <span style="flex:1"></span><button class="btn small" data-logcombo='${esc(JSON.stringify({ legs: r.L.map(x => x.label), names: r.L.map(x => x.names), p: r.Q, take: Math.floor(r.take * 100), start: Math.min(...r.L.map(x => x.start)) }))}'>I bet this</button></div></div>`;
  return `<h2 class="sec">💥 Value parlays <span>built only from TAKE legs</span></h2>
    <div class="card list">${byEV.map(card).join("")}</div>
    ${byPay.length ? `<h3 style="font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin:12px 2px 6px">Bigger payouts (still +EV, hit less often)</h3><div class="card list">${byPay.map(card).join("")}</div>` : ""}
    <p class="note" style="margin:6px 2px">Every leg is a current TAKE bet, so its edge carries into the parlay. Build it on Kalshi as a combo (request a quote) and accept only at the listed price or less; each leg must still be at or under its own price. Legs are different matches, treated as independent. Over 15 years, parlays of favourites lost 4–8% while parlays of +EV legs made +9% (2 legs) to +15% (3 legs). Most of these still lose: a 3-leg parlay with underdog legs might hit 1 time in 15–30. Keep them at the small stakes shown, and never chase a missed parlay.</p>`;
}

  if (stayL.length) h += `<h2 class="sec">🚫 Stay away <span>${stayL.length} · unpredictable, don't bet either side</span></h2>` + mini(stayL, m => m.risk.stay[0]);

  if (goodL.length) h += `<details class="card" style="margin-top:12px;padding:4px 12px"><summary style="padding:8px 0;font-weight:700;cursor:pointer">🛡 Steadier favourites (${goodL.length}): not bets by themselves</summary>
    <p class="note">Situations where favourites won more often than their price said, in both halves of the data. They become bets only when a TAKE card appears (e.g. veteran favourite).</p>${mini(goodL, m => m.risk.fav + ": " + m.risk.good[0])}</details>`;
  h += `<div class="callout"><b>How to use this:</b> only the green <b>TAKE</b> cards above are bets. Stake the units shown (1u = $${unitVal().toFixed(0)}) and only at the price shown or better.
    These come from the strategies with a real basis — ${staking.map(esc).join(", ")} — and none is proven on tennis yet, so stakes are small. Everything in the watchlist below is tracked on paper only: <b>don't bet it</b>; the Model record tab shows if it ever earns a stake.</div>`;
  h += `<details class="card" style="margin-top:14px;padding:4px 12px"><summary style="padding:8px 0;font-weight:700;cursor:pointer">👀 Watchlist — paper only, don't bet (${watch.length})</summary>
    <p class="note">Model-based picks that failed the Kalshi backtests. They're logged and graded automatically so we find out for sure; if one strategy keeps winning over 100+ picks, it gets promoted to a TAKE.</p>
    ${watch.length ? `<div class="list">${watch.map(pickCard).join("")}</div>` : `<div class="empty">Nothing on the watchlist.</div>`}</details>`;
  h += `<h2 class="sec">Tools <span>reference prices, not bets on their own</span></h2>`;
  h += renderLines();
  h += renderFutures();
  const combos = (B.combos || []).filter(c => c.start > Date.now() / 1000 - 600);
  h += `<h2 class="sec">Combos <span>request a quote on Kalshi, take it at or below the price</span></h2>`;
  h += combos.length ? `<div class="card list">${combos.map(c => `<div class="pick">
      <div><div class="what">${c.legs.map(esc).join(" + ")}</div>
        <div class="sub">${c.kind === "same" ? esc(c.names.join(" vs ")) + " · same match" : c.names.map(n => esc(n.join(" v "))).join(" & ")} · ${dayOf(c.start)} ${when(c.start)}</div></div>
      <div class="right"><div class="units" style="color:var(--ink)">${c.fair_c}¢</div><div class="note">fair</div></div>
      <div class="row2"><span class="badge">${pct(c.p, 1)} chance</span><span class="badge warn">Take ≤ ${c.take_at ?? "—"}¢</span>
        ${c.kind === "same" ? `<span class="badge ${c.lift > 0 ? "good" : "bad"}">${c.lift > 0 ? "legs go together" : "legs pull apart"} ${sgn(c.lift, 0)}</span>` : `<span class="badge good">${sgn(c.ev_at_asks)} at current asks</span>`}
        <span style="flex:1"></span><button class="btn small" data-logcombo='${esc(JSON.stringify({ legs: c.legs, names: c.names, p: c.p, take: c.take_at, start: c.start }))}'>I bet this</button></div></div>`).join("")}</div>`
    : `<div class="card empty">No combos worth requesting right now.</div>`;
  h += `<p class="note" style="margin:12px 2px">Same-match combos price exactly from the model's set-by-set simulation, so "fav wins + under" is priced with the correlation a sportsbook parlay ignores. Two-match combos multiply two independent value bets; keep combos to 2 legs.</p>`;
  return h;
}

// ------------------------------------------------------------- sportsbook line shopping
function renderLines() {
  const L = B.lines || [], meta = B.lines_meta || {};
  let h = `<h2 class="sec">Sportsbook value <span>US books paying more than Pinnacle's fair line</span></h2>`;
  if (meta.status === "no key") return h + `<div class="card empty">Waiting for the Odds API key to be added to the cloud job.</div>`;
  const age = meta.ts ? ago(meta.ts) : "never";
  const offers = [];
  L.filter(ln => Date.parse(ln.start) / 1000 > Date.now() / 1000 + 300).forEach(ln => (ln.value || []).forEach(o => offers.push({ ...o, ln })));
  if (meta.ts && Date.now() / 1000 - meta.ts > 3 * 3600) h += `<div class="callout">⚠ These sportsbook prices were checked ${age}. They're too old to bet as-is, so they aren't TAKE cards. The scanner rechecks as its daily Odds API budget allows.</div>`;
  offers.sort((a, b) => b.ev - a.ev);
  const t = tsettings(), kf = B.config.kelly_frac || 0.25, maxU = B.config.max_units || 3;
  const unitsFor = (p, o) => { const k = (p * o - 1) / (o - 1); if (k <= 0) return 0; return Math.round(Math.min(Math.max(k * kf / (t.unit_pct / 100), 0.25), maxU) * 4) / 4; };
  const note = `<p class="note" style="margin:6px 2px">Prices checked ${age} (the free Odds API plan allows a few scans a day; ${meta.remaining ?? "?"} credits left this month). Books move fast: confirm the price is still there before betting. This line-shopping approach tested +1.4% to +3.1% per bet across sports; it hasn't been proven on tennis yet.</p>`;
  if (!offers.length) return h + `<div class="card empty">No US sportsbook price beats Pinnacle by 2%+ in the last scan${L.length ? ` (${L.length} matches checked)` : ""}.</div>` + note;
  h += `<div class="card list">${offers.slice(0, 12).map(o => { const p = o.ln.fair[o.player], u = unitsFor(p, o.price); return `<div class="pick">
    <div><div class="what">${esc(o.player)} <span class="note">to win</span></div><div class="sub">${esc(o.ln.names.join(" vs "))} · ${dayOf(Date.parse(o.ln.start) / 1000)} ${when(Date.parse(o.ln.start) / 1000)}</div></div>
    <div class="right"><div class="units">${u}<small>u</small></div><div class="note">$${(u * unitVal()).toFixed(0)}</div></div>
    <div class="row2"><span class="badge good">${esc(o.book)} ${esc(o.us)}</span><span class="badge">Pinnacle fair ${pct(p)}</span><span class="badge good">${sgn(o.ev)} EV</span>
      <span style="flex:1"></span><button class="btn small primary" data-logbook='${esc(JSON.stringify({ n: o.player, b: o.book, o: o.price, m: o.ln.names.join(" vs "), t: (o.ln.tickers || {})[o.player] || null, u }))}'>I bet this</button></div></div>`; }).join("")}</div>` + note;
  return h;
}

// ------------------------------------------------------------- all-sports sportsbook board
const SPORT = { americanfootball_nfl: "NFL", americanfootball_ncaaf: "College football", basketball_nba: "NBA", basketball_ncaab: "College basketball",
  icehockey_nhl: "NHL", baseball_mlb: "MLB", basketball_wnba: "WNBA", mma_mixed_martial_arts: "MMA", boxing_boxing: "Boxing" };
const sportName = s => SPORT[s] || s.replace("soccer_", "Soccer: ").replace("tennis_", "Tennis: ").split("_").join(" ");
const betText = b => { const o = String(b.outcome).split("|")[0], g = String(b.sport || "").startsWith("tennis") ? " games" : "";
  return b.market === "spreads" ? `${o} ${b.point > 0 ? "+" : ""}${b.point}${g}` : b.market === "totals" ? `${o} ${b.point}${g}` : `${o} to win`; };
function bookCombos(open) {
  // Parlays only of +EV legs, all at the same book and from different games: each leg's edge multiplies.
  // 15-year test: parlays of plain favourites lost 4-8% at Bet365, while 2-3 leg parlays of line-shopping legs made +9% to +15% (wide error bars).
  const byBook = {};
  open.filter(b => b.start > Date.now() / 1000 + 600 && b.price <= 3.5 && !b.flag).forEach(b => (byBook[b.book] = byBook[b.book] || []).push(b));
  const out = [];
  for (const [book, L] of Object.entries(byBook)) {
    for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++) {
      if (L[i].game === L[j].game) continue;
      out.push([book, [L[i], L[j]]]);
      for (let k = j + 1; k < L.length; k++) if (L[k].game !== L[i].game && L[k].game !== L[j].game) out.push([book, [L[i], L[j], L[k]]]);
    }
  }
  if (!out.length) return "";
  const rows = out.map(([book, legs]) => { const odds = legs.reduce((a, b) => a * b.price, 1), p = legs.reduce((a, b) => a * b.fair, 1); return { book, legs, odds, p, ev: p * odds - 1 }; })
    .sort((a, b) => b.ev - a.ev).slice(0, 4);
  const us = d => d >= 2 ? `+${Math.round((d - 1) * 100)}` : `${Math.round(-100 / (d - 1))}`;
  return `<h2 class="sec">🔗 Combos from these bets <span>same book, +EV legs only</span></h2><div class="card list">${rows.map(r => `<div class="pick">
      <div><div class="what">${r.legs.length}-leg parlay at ${esc(r.book)} · ${esc(us(r.odds))}</div><div class="sub">${r.legs.map(b => esc(betText(b))).join(" + ")}</div></div>
      <div class="right"><div class="units">0.5<small>u</small></div></div>
      <div class="row2"><span class="badge good">${sgn(r.ev)} EV</span><span class="badge">hits ${pct(r.p)}</span><span style="flex:1"></span>
      <button class="btn small" data-logbook='${esc(JSON.stringify({ l: `Parlay: ${r.legs.map(b => betText(b)).join(" + ")} (${r.book})`, b: r.book, o: Math.round(r.odds * 1000) / 1000, m: r.legs.map(b => b.game).join(" | "), t: null, u: 0.5, ty: "Combo", s: "+EV parlay (books)" }))}'>I bet this</button></div></div>`).join("")}</div>
    <p class="note" style="margin:6px 2px">Every leg must still be at its listed price. Combos multiply the edge and the swings. Over 15 years, parlays of plain favourites lost 4–8%, while parlays of +EV legs made +9% (2 legs) to +15% (3 legs), but with wide error bars. So keep them at 0.5u.</p>`;
}

  h += tbl("Sport", SB.by_sport || {}) + tbl("Book", SB.by_book || {});
  if ((SB.recent || []).length) h += `<h2 class="sec">Recently settled</h2><div class="card list">${SB.recent.slice(0, 20).map(b => `<div class="bet"><div><div class="what">${esc(betText(b))}</div><div class="sub">${esc(sportName(b.sport))} · ${esc(b.game)} · ${esc(b.book)} ${esc(b.us)} · ${b.units}u${b.clv != null ? ` · CLV ${sgn(b.clv)}` : ""}</div></div><div class="res ${b.result === "win" ? "pos" : b.result === "loss" ? "neg" : ""}">${b.result === "push" ? "push" : (b.pnl_units >= 0 ? "+" : "") + (b.pnl_units || 0).toFixed(2) + "u"}</div></div>`).join("")}</div>`;

  return h;
}

// ------------------------------------------------------------- tournament winners (draw simulation)
function renderFutures() {
  const F = B.futures || [];
  if (!F.length) return "";
  const fb = (B.model_meta && B.model_meta.futures_backtest) || null;
  let h = `<h2 class="sec">Tournament winners <span>exact draw odds vs Kalshi</span></h2>
    <div class="callout" style="margin-top:0">Every remaining match path in the draw is priced: matches already on Kalshi use Kalshi's own live price, later rounds use the model shifted by what Kalshi says about each player now. "Win" is the pure draw simulation; "Value" uses a 50/50 mix of that and Kalshi's mid (when there is a real book) and must beat the ask (or, for a "No", the bid) after the fee.${fb ? ` Backtest: ${esc(fb.summary)}` : " Tracked on paper until the backtest and live record back it."}</div>`;
  for (const t of F) {
    const rows = t.players.filter(p => p.alive !== false).slice(0, 12);
    const keys = rows.length ? Object.keys(rows[0].reach).slice(-4) : [];
    h += `<div class="card" style="margin-top:10px;padding:8px 10px"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><b>${esc(t.tourney)}</b><span class="note">${esc(t.surface)} · ${t.nudged ? t.nudged + " players priced off Kalshi" : "model only"}</span></div>
      <div class="tw"><table><tr><th>Player</th>${keys.slice(0, -1).map(k => `<th class="n">${k}</th>`).join("")}<th class="n">Win</th><th class="n">Kalshi</th><th class="n">Value</th><th></th></tr>
      ${rows.map(p => { const ev = p.side === "yes" ? p.ev_yes : p.ev_no; return `<tr><td>${esc(p.name)}</td>${keys.slice(0, -1).map(k => `<td class="n">${pct(p.reach[k])}</td>`).join("")}
        <td class="n"><b>${pct(p.sim ?? p.fair, 1)}</b></td><td class="n">${cents(p.bid)}/${cents(p.ask)}</td>
        <td class="n ${ev != null && ev > 0 ? "pos" : ""}">${ev != null && ev > 0 ? (p.side === "yes" ? "Yes " : "No ") + sgn(ev, 0) : "—"}</td>
        <td>${p.tags.length ? `<button class="btn small" data-logfut='${esc(JSON.stringify({ t: p.ticker, n: p.name, s: p.side, b: p.bid, a: p.ask, tn: t.tourney, tour: t.tour }))}'>Log</button>` : ""}</td></tr>`; }).join("")}</table></div></div>`;
  }
  return h;
}

}

  let h = `<h2 class="sec" style="margin-top:14px">📒 Prediction ledger <span>are we getting closer to predicting the future?</span></h2>`;
  if (!L || !L.all) return h + `<div class="card empty">Scored from 5 Nov 2026 (after the ITF in-play fix). Every rated match is logged with Kalshi's opening and closing prices and our numbers; the scorecard appears as matches settle (${L?.pending ?? 0} waiting).</div>`;
  const cell = (g, k, ref) => g && g["ll_" + k] != null ? `<td class="n ${g["ll_" + k] <= g["ll_" + ref] ? "pos" : ""}">${g["ll_" + k].toFixed(3)}</td>` : `<td class="n">—</td>`;
  const row = (name, g) => g ? `<tr><td>${esc(name)}</td><td class="n">${g.n}</td>${cell(g, "open", "close")}${cell(g, "model", "close")}${cell(g, "final", "close")}${cell(g, "adj", "close")}<td class="n"><b>${g.ll_close.toFixed(3)}</b></td>
    <td class="n">${g.lead_n ? `${pct(g.lead_toward, 0)} / ${pct(g.lead_away, 0)}` : "—"}</td></tr>` : "";
  const a = L.all;
  const gapMr = a.ll_mr != null ? `With market ratings our model scored ${a.ll_mr.toFixed(3)} against the close's ${a.ll_close_mr.toFixed(3)} on the same ${a.n_mr} matches.` : "";
  h += `<div class="card tw" style="padding:6px 8px"><table><tr><th></th><th class="n">Matches</th><th class="n">Kalshi open</th><th class="n">Our model</th><th class="n">Model + market</th><th class="n">+ signals</th><th class="n">Kalshi close</th><th class="n">Price moved toward / away from us</th></tr>
    ${row("All", a)}${row("Last 7 days", L.last7)}${Object.entries(L.by_level || {}).map(([k, g]) => row(k, g)).join("")}</table></div>
    <p class="note" style="margin:6px 2px">Log-loss: lower is better, 0.693 is a coin flip. <b>Kalshi close</b> is the bar to beat. "Toward / away" covers matches where our model disagreed with the opening price by 3+ pts: how often the price then moved our way before the start (and by ${a.lead_move ?? "—"} pts on average).
    If "toward" stays well above "away", our model knows things before the market does: that's what predicting the future looks like. ${gapMr}</p>`;
  if ((L.weeks || []).length > 1) h += `<div class="card" style="padding:6px 10px;margin-top:8px"><b style="font-size:13px">Weekly gap to the close</b> <span class="note">(our model minus close; closer to 0 = better)</span>
    <div class="note">${L.weeks.map(w => `${w.ago}w ago: ${(w.ll_model - w.ll_close >= 0 ? "+" : "")}${(w.ll_model - w.ll_close).toFixed(3)} (${w.n})`).join(" · ")}</div></div>`;
  return h;
}
function renderRecord() {
  const r = B.record || {}, by = r.by_strategy || {}, mm = B.model_meta || {};
  const rows = Object.entries(by).sort((a, b) => b[1].n - a[1].n);
  let h = renderLedger();
  h += `<h2 class="sec">Paper record <span>every pick, logged automatically before the match</span></h2>`;
  h += rows.length ? `<div class="card tw" style="padding:6px 8px"><table><tr><th>Strategy</th><th class="n">Bets</th><th class="n">Won</th><th class="n">ROI flat</th><th class="n">Units</th><th class="n">CLV</th></tr>
    ${rows.map(([k, s]) => `<tr><td>${esc(k === "all" ? "All picks" : B.config.strategies[k]?.label || k)}</td><td class="n">${s.n}</td><td class="n">${pct(s.w / s.n)}</td><td class="n ${s.roi_flat >= 0 ? "pos" : "neg"}">${sgn(s.roi_flat)}</td><td class="n ${s.pnl_u >= 0 ? "pos" : "neg"}">${s.pnl_u >= 0 ? "+" : ""}${s.pnl_u}</td><td class="n ${s.clv_c >= 0 ? "pos" : "neg"}">${s.clv_c >= 0 ? "+" : ""}${s.clv_c}¢</td></tr>`).join("")}</table></div>`
    : `<div class="card empty">The record starts with today's picks; results appear as matches settle.</div>`;
  h += `<p class="note" style="margin:8px 2px">${r.pending || 0} picks waiting to settle. <b>CLV</b> = how much the price moved toward the pick between when it was flagged and the start. Positive CLV over many bets is the quickest honest sign a strategy is real; ROI needs hundreds of bets to mean much.</p>`;
  const kb = mm.kalshi_backtest;
  if (kb) h += `<h2 class="sec">Backtest vs real Kalshi prices <span>${esc(kb.period || "")}</span></h2><div class="card tw" style="padding:6px 8px"><table><tr><th>Rule</th><th class="n">Bets</th><th class="n">Won</th><th class="n">ROI</th></tr>${kb.rows.map(x => `<tr><td>${esc(x.rule)}</td><td class="n">${x.n}</td><td class="n">${pct(x.win)}</td><td class="n ${x.roi >= 0 ? "pos" : "neg"}">${sgn(x.roi)}</td></tr>`).join("")}</table></div><p class="note" style="margin:8px 2px">${esc(kb.note || "")}</p>`;
  const wf = mm.walk_forward || [];
  if (wf.length) h += `<h2 class="sec">Prediction accuracy by year <span>walk-forward, never trained on the year it predicts</span></h2><div class="card tw" style="padding:6px 8px"><table><tr><th>Year</th><th class="n">Matches</th><th class="n">Elo only</th><th class="n">Model</th><th class="n">Log-loss</th></tr>${wf.map(x => `<tr><td>${x.year}</td><td class="n">${x.n.toLocaleString()}</td><td class="n">${pct(x.acc_elo, 1)}</td><td class="n">${pct(x.acc_model, 1)}</td><td class="n">${x.ll_model.toFixed(3)}</td></tr>`).join("")}</table></div>`;
  const rec = r.recent || [];
  if (rec.length) h += `<h2 class="sec">Recently settled picks</h2><div class="card list">${rec.map(e => `<div class="bet"><div><div class="what">${esc(e.label)}</div><div class="sub">${esc(e.names.join(" vs "))} · ${esc(e.tags.map(t => B.config.strategies[t]?.label || t).join(", "))} · in at ${cents(e.entry)}, closed ${cents(e.close)}</div></div><div class="res ${e.result === "yes" ? "pos" : "neg"}">${e.result === "yes" ? "WON" : "LOST"}<div class="note">${e.units}u</div></div></div>`).join("")}</div>`;
  return h;
}

  <h2 class="sec">How it works</h2><div class="card" style="padding:12px 14px;font-size:14px">
  <p><b>Ratings.</b> Every pro match since 1985 (tour, Challenger, ITF, ATP and WTA) is replayed to build Elo ratings per surface, weighted by how dominant each win was, plus each player's serve and return strength adjusted for opponents, recent form, fatigue (minutes in the last 10 days), layoffs and head-to-head. New results are added every refresh from TennisMyLife, ESPN and Kalshi settlements.</p>
  <p><b>Match maths.</b> Each player's chance of winning a point on serve feeds an exact simulation of games, tiebreaks and sets. That gives the win probability and also set scores, total games, game spreads and set winners — all consistent, so combos are priced with real correlation.</p>
  <p><b>Market.</b> The final number blends the model with Kalshi's price (weights fitted on settled Kalshi matches). A bet is only flagged when the model still beats the ask after Kalshi's fee by enough margin.</p>

  <p><b>What the tests found</b> (5,500 Kalshi ATP, WTA and Challenger matches, June 2025 – Nov 2026, priced at the real ask an hour before the start):</p>
  <ul style="margin:0 0 10px;padding-left:18px">

    <li>Tailing big tickets or one-way flow <b>lost 3%</b> after fees; line moves and steam broke even. Following the best Polymarket tennis wallets also broke even out of sample.</li>
    <li>Also tested and failed at real prices: early lines right after markets open (as sharp as the close), games totals and spreads (Kalshi's own prices beat the model; gaps lost 11–15%), in-play gaps vs the score model (−6 to −19%), fading big in-play swings (−19%), following them (−1%), and resting limit orders (makers broke even per match).</li>
    <li>Sets: Kalshi's set-1, set-2 and exact-set-score markets are priced almost exactly as our model derives them from the match price (gaps of 3%+ are rare and didn't pay). Backing the set-1 loser to win set 2 lost 8.5% over 2,176 matches (−11.7% when that loser was the favourite).</li>
    <li>Combos: Kalshi only offers tennis legs inside multi-sport parlays, priced by market makers; there's too little history to test, and combining legs that aren't individually +EV just compounds the fee.</li>
    <li>Upsets (7,450 Kalshi matches, 12 situational factors: home crowd, win streaks, schedule and minutes played, coming off a retirement, surface switch, layoffs, title runs, lefties, age, ranking, late season): none predicts upsets beyond the price. The market tends to <i>over</i>-react instead: home underdogs lost 16–20%, and favourites who played 200+ minutes in the last 3 days against a fresh opponent won more than priced (+17% then +14%, 95 matches) — now a small-stake TAKE rule, graded live.</li>
    <li>Form, head-to-head and style matchups (820k matches, then 7,200 Kalshi matches): form is real — favourites in much better recent form than their opponent win ~2.5 pts more than ratings say, and much colder ones ~4.4 pts less — and the model already uses the best form measure (results beyond expectation). But Kalshi prices form too: adding it to the market barely changed anything, and backing hot underdogs broke even. Head-to-head and record against similar playing styles help even less (+0.0002 log-loss) and backing the better style matchup on Kalshi lost 8–10%.</li>
    <li>Cheap longshots look overpriced, but that's mostly the spread and fee being large next to a 5–15¢ price; nobody collects it after costs.</li>
    <li>So the board's fair prices lean on the market, and every strategy is tracked on paper until its own record proves it. Ideas still open: <b>price gaps between venues</b> (Kalshi vs Polymarket, tracked live here), <b>sportsbook line shopping</b> against Pinnacle, and <b>tournament-winner / reach-a-round markets</b> priced by simulating the draw.</li>
  </ul>
  <p><b>15 years of sportsbook prices</b> (27,300 ATP 2010–24 and WTA 2020–24 matches with Pinnacle's closing odds and the best price across books, from tennis-data.co.uk; rules picked on 2010–17 and checked on 2018–24):</p>
  <ul style="margin:0 0 10px;padding-left:18px">

    <li><b>Line shopping works</b>, in both halves: when the best book price beat Pinnacle's no-vig fair odds by 2%+, it returned +3% to +8% at odds of 1.0–3.0. Above 3.0 the result was mixed, and longshots above 5.0 lost even at the best price. So tennis sportsbook bets are now capped at 3.0 odds. Odds come from a historical database, so some "best prices" may have been brief, and real results will be a bit lower.</li>
    <li><b>Ladders</b> (restake part of a winning run's profit). They don't change the edge per dollar staked; they just stake more. On favourites at Pinnacle (−1.1%), every ladder lost more than flat betting. "Let it ride" with no bank point lost 1,466u on 5,587 bets. On +EV line-shopping bets (2,753 bets, flat +209u, worst drawdown 19u), restaking 25% made +249u (40u drawdown), and letting it ride while banking after 5 wins made +427u (171u drawdown). Never-banking let-it-ride lost 1,301u even there. Kalshi favourites (3,386 bets, −2.9%) lost under every ladder. Use the ladder in My bets only on bets with an edge.</li>

    <li><b>Form.</b> Markets <i>over</i>-rate a hot underdog. When the underdog's recent form beat the favourite's, the favourite won 1–2 points more than Pinnacle priced. Backing that favourite returned +1.7% / +2.6% at the best price in the two halves, about 0% at Pinnacle, and break-even on Kalshi after the fee. It is tracked as a paper strategy. Backing hot underdogs lost 12.8% at Pinnacle.</li>
    <li><b>Tired favourite</b> (10-day minutes): +1.4% / +3.7% at Pinnacle and +3.3% / +6.1% at the best price. That supports the live 3-day rule, although the 10-day version lost on Kalshi's smaller sample.</li>

    <li><b>Challengers aren't upset city.</b> Over 2015–26, rating favourites won 64.6% at Challengers, 64.8% at ATP/WTA 250–500 and 65.4% at Masters, against 70.8% at Slams and 70.7% at ITFs. Masters events had the most upsets relative to ratings (−3.4 pts). On Kalshi Challengers, backing underdogs lost 9% and big underdogs 22%: people overpay for upsets there.</li>
    <li><b>Predicting upsets</b> (tools/upset_risk: 8,000 Kalshi and 27,000 Pinnacle-priced matches, every signal checked in both halves). Nothing reliably predicts upsets beyond the price; the market already prices most of what you'd think of. What did show up:
      <ul style="margin:4px 0;padding-left:16px">
        <li><b>Favourites under-priced:</b> veterans aged 32+ (won +3.8 and +4.3 pts above price), heavy favourites at 80%+, best-of-5, and when the underdog is the hotter player. Veteran favourites returned +3.7% and +3.4% at Kalshi's real ask, so they are now a small-stake TAKE rule.</li>
        <li><b>Stay away:</b> when our ratings and the market disagree by 20+ pts, the price was least reliable (the favourite beat its price by 6 pts in one half and missed it by 8 in the other). Also stay away right after a player retired injured.</li>
        <li><b>Upset alerts:</b> favourites who played 4+ matches in 7 days ran about 1.4 pts under their price in both halves, and favourites back from 45+ days off have more uncertain results. These are minor effects, so treat them as reasons to skip, not to bet the underdog.</li>
      </ul></li>
    <li><b>Using past matches and past upsets</b> (tools/rules_lab, 27,300 Pinnacle-priced matches, each idea fitted on 2010–17 and checked on 2018–24). None of these beat the closing price in both halves:
      <ul style="margin:4px 0;padding-left:16px">
        <li>players who beat or missed their odds before (no carry-over);</li>
        <li>a player's record at the same tournament;</li>
        <li>the match after an upset win or upset loss (it flipped sign between the halves);</li>
        <li>last match's scoreline;</li>
        <li>qualifiers;</li>
        <li>ranking vs rating;</li>
        <li>surface specialists;</li>

    <li><b>Market ratings (new).</b> Each player's strength is now also learned from their past pre-match prices: Pinnacle 2010–24, then every Kalshi match. That predicts matches the market hasn't priced yet better than results alone. Log-loss went from 0.608 to 0.602 on 2018–24, and from 0.630 to 0.625 on 5,263 Kalshi matches. It is now used to price later rounds in the tournament-winner simulation, and it shows in each match's details.</li>
    <li><b>Underdog days aren't real</b> (tools/day_effects). On Pinnacle prices, upsets per day were spread exactly as if every match were independent. On Kalshi, an upset-heavy morning didn't predict the afternoon (correlation −0.01). Backing underdogs after upset-heavy days lost 6–10%, and after favourite-heavy days 9–17%. Post-mortem of 4 Nov 2026 (tools/postmortem): 59 upsets against 62.8 expected across 250 matches, a normal day. Paris had 8 upsets, and our model agreed with the market on every one.</li>

      </ul>

    <li><b>📒 Prediction ledger</b> (Model record tab, from 4 Nov 2026): every rated match logs Kalshi's opening and closing prices next to our numbers. It shows whether we're as sharp as the close, and whether the price moves toward our number before the start.</li>
    <li><b>Uncertainty-aware ratings</b> (tools/uncertainty, tools/uncertainty_disagree: 551,000 walk-forward predictions). Pulling predictions toward 50/50 for newcomers or players back from layoffs didn't help, because the model already handles those. What did work: when our own sub-models disagree (overall Elo vs surface Elo vs serve/return), the model was 2–3 pts overconfident, so it now shrinks those predictions. Log-loss improved from 0.5727 to 0.5723 on unseen 2021–26 matches, and from 0.6115 to 0.6097 on Kalshi matches. Next to the market it changes nothing (Kalshi already prices those matches right). It sharpens the model where it works alone: tournament odds, unpriced matches and the ledger. Match details show "Model confidence".</li>
    <li><b>Verdicts</b> on every match, using the final market-blended chance:

      <b>Close matches</b> (tools/close_matches, tools/close_books): on 1,700 Kalshi and 5,500 Pinnacle matches with the favourite at 50–58%, no signal picked winners better than the price in both halves. That covers our model, serve/return stats, form, rest, minutes played, money flow, big tickets, steam, line moves, ranking, age, streaks, home crowd, head-to-head, reputation and surface. All of them combined did worse than the market. The price is well calibrated there (favourites won 54–55% at 54%). In-form players actually won a bit less than 50% of close matches. The only thing that made money on close matches was a better price (line shopping).

    <li><b>Layoffs</b> (tools/layoff_study: Kalshi tour+Challenger, Kalshi ITF, Pinnacle 2016–24).

        <li><b>Underdogs coming back from a month or more off are over-rated.</b> Backing them lost 17–37% at Pinnacle and 14–30% on Kalshi (normal is 3–8%). The board now says "Don't back X" on those matches.</li>

      </ul></li>
    <li><b>ITF</b> (tools/itf_study, 6,900 Kalshi ITF matches, Aug–Nov 2026). The market is sharper than our ratings (log-loss 0.533 vs 0.585); fitted together our model gets 13% weight.
      <ul style="margin:4px 0;padding-left:16px">
        <li><b>Close matches where our model picks the underdog</b> (the Tanasie case: about 60/40 before the start, our ratings preferred her, she won): +2% in one half, −12% in the other. That's not a rule.</li>
        <li><b>Model 30+ pts below the market on the favourite:</b> the favourite won ~71% against 76–77% priced in both halves, and backing the underdog returned +15% and +14%, but with wide error bars. It's now a paper strategy.</li>
        <li><b>Teen favourites (18 or under):</b> backing their underdogs lost 42% and 25%. The board now says "Don't back".</li>
      </ul></li>
    <li><b>Signals in the shown chance</b> (tools/net_adjust). The net signal score now nudges each match's displayed chance and verdict, at half strength on tour/Challenger and a quarter on ITF. That made the price slightly more accurate than Kalshi's own in both halves (newer half log-loss 0.58384 → 0.58324 tour, 0.52202 → 0.52161 ITF). At full strength it over-corrected, and betting the disagreements didn't pay (+0.9% then −5.5%), so no stakes depend on it.</li>
    <li><b>Thinking like the market</b> (tools/market_mind). We tested 10 public habits on toss-ups, leans and confident matches, measuring both the public side and the contrarian side: fame (better-ranked), high-attention matches, crowd money, big tickets, hot streaks, home crowd, youth hype, chasing price moves and big stages.
      <ul style="margin:4px 0;padding-left:16px">

        <li>No contrarian side made money in both halves after Kalshi's fee. The market charges the public for its habits, but not enough to pay the other side.</li>
        <li>The board now says "Don't back" on home players (tour and Challenger).</li>
        <li><b>Round 2</b> (tools/market_mind2, habits of Kalshi's US public):
          <ul style="margin:2px 0;padding-left:14px">
            <li>American players: overbet at home (−22% / −10%), but abroad only −3% / −18%. That's the home effect, already flagged.</li>

          </ul></li>
      </ul></li>
    <li><b>Rule scan</b> (tools/rule_scan, tools/rule_scan_pin). We tested about 4,000 "back this player when…" rules built from every variable: fatigue, rest, layoff, form, streaks, age, ranking, head-to-head, surface, serve/return, home crowd, money flow, line moves, model edge, reputation, upsets and scheduling, alone and combined with price bands, on Kalshi tour/Challenger, Kalshi ITF and 15 years of Pinnacle. Each rule was picked on the oldest 50% of matches, checked on the next 25% and tested on the newest 25%. As a luck check, we reran the scan on outcomes simulated from the market's own prices, where no edge can exist. The real data produced no more survivors than luck did: tour 1 vs ~3.3, tour leans (favourite 58–70%) 1 vs ~1.4, ITF 0, Pinnacle 1 vs ~1.5 and 0 vs ~1.5. Leans and toss-ups are priced right: no signal reliably picks which leans to back or fade. The rules that do work came from specific reasons tested directly: tired and veteran favourites, Locks, underdog value, line shopping.</li>
    <li><b>Tired underdogs</b> (tools/tired_dog). Unlike tired favourites (still +15.6% / +17.5% when backed on Kalshi), tired underdogs aren't over-punished by the market. Backing an underdog with 400+ min in 10 days against a fresh favourite lost 13.7% and 10.0% at Pinnacle (normal is 4–6%), and on Kalshi the results flipped or matched the usual underdog loss. The board now says "Don't back" on them.</li>
    <li><b>💰 Underdog value</b> (tools/dog_sweep, with the retuned ratings). For underdogs priced 15–30c that our model rates 10+ pts higher (20+ in ITF):
      <ul style="margin:4px 0;padding-left:16px">
        <li>Tour/Challenger: they won 28% against 23–24% priced and returned +15.3% then +11.1%, while all cheap underdogs returned +0.9% then −9.3%.</li>
        <li>ITF: +3.2% then +3.1%, while all cheap ITF underdogs lost 10–13%.</li>
        <li>Pricier underdogs (30–50%) flipped between halves, so they're out.</li>
        <li>Toss-ups: still no pick beats the price (our model picks close-match winners only 50–52% of the time).</li>
      </ul>
      These are value bets that lose about 3 in 4, so stakes are small.</li>
    <li><b>ITF favourites our ratings rate 30+ pts lower</b> (the Gogineni vs Mirarchi case, 5 Nov 2026: Kalshi 76–80%, our model 42%): backing them lost 11.3% and 9.7% in the two halves of 6,900 Kalshi ITF matches. The board now says "Don't back" on these and marks them as upset risk. Also fixed: thin ITF markets weren't detected as in play (Kalshi's listed start time can be hours off), so in-play prices were being treated as pre-match.</li>
    <li><b>Ratings retuned</b> (tools/elo_tune: walk-forward replay of 1.6M matches since 1985; settings chosen on ITF 2016–21, judged on 2022–26). Ratings now learn faster, especially for newer players, count scorelines more, and weight Challenger and qualifying results at 80%. Elo log-loss improved from 0.5641 to 0.5600 on ITF and from 0.5760 to 0.5716 on all levels. The full model's 2016–26 walk-forward went from 0.5726 to 0.5685 (69.9% of winners). That's bigger than every feature added before it combined. On Kalshi ITF our model improved from 0.585 to 0.578, and the drift of opening prices toward our number got stronger (55–56% toward vs 35% away when we disagree by 20+ pts). On tour and Challenger matches next to Kalshi it's about unchanged.</li>
    <li><b>ITF opening lines</b> (tools/itf_openers, 6,800 matches, each price path from Kalshi's first tradable quote, a median 12 h before the start):
      <ul style="margin:4px 0;padding-left:16px">
        <li>The opening price is almost as sharp as the close (log-loss 0.545/0.535 vs 0.537/0.529).</li>
        <li><b>The price drifts toward our model after the open</b> (51–53% toward vs 36–39% away, bigger when we disagree more, both halves). Our ratings do lead the ITF market a little.</li>
        <li>Betting our raw model at the open still lost 2–17%, because the spread and fee are bigger than the drift.</li>
        <li>A 13/90 model+market blend at a 6%+ edge was positive out of sample (+4.8%, positive closing-line value) on only ~70 bets. It's now a paper strategy (ITF early line) until the live record confirms it.</li>
      </ul></li>
    <li><b>Live matches</b> keep their pre-match price and verdict; the in-play price is shown separately (it used to replace the pre-match read once a match started).</li>
    <li><b>🔒 Locks</b> (tools/locks): a market favourite at 85%+, our model within 10 pts, no risk flags, not ITF. These won 93.2% and 93.7% in the two halves (priced at 90.8%) and returned +1.4% and +2.0% at the real ask. At 90%+ they won 95–96%. Shown as YES picks, with small stakes when the price is 95¢ or less.</li>
    <li><b>Total games.</b> Anchored to Pinnacle's price, the engine was within 0.3 games per match on average. Best-of-3 matches ran ~0.3 games short, while grass and best-of-5 ran longer (+0.65 on grass). These offsets are now built into the totals. Kalshi's totals still beat our fair price, so games over/unders are bet only via the Books tab: US books against Pinnacle's own totals and games spreads, tennis first.</li>
  </ul>
  <p><b>Units.</b> Stakes are quarter-Kelly in units (1u = 1% of bankroll by default), capped at ${B.config.max_units}u.</p>
  <p><b>Strategies being tracked:</b> ${Object.values(s).map(x => esc(x.label)).join(" · ")}. Every pick is logged before the match and graded automatically on the Model record tab. Trust the strategies that keep positive CLV and ROI over hundreds of bets; drop the ones that don't.</p>
  <p class="note">Not financial advice. Betting loses money for most people; bet only what you can afford to lose. Data: Jeff Sackmann's archive (CC BY-NC-SA), TennisMyLife, ESPN, Kalshi and Polymarket public APIs.</p></div>
  ${(B.notes || []).length ? `<p class="note">Last refresh notes: ${B.notes.map(esc).join(" · ")}</p>` : ""}`;
}

// ------------------------------------------------------------- render + events
function render() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === S.tab));
  renderFilters();
  if (!B) return;
  const f = { picks: renderPicks, board: renderBoard, books: renderBooks, tracker: renderTracker, record: renderRecord, guide: renderGuide }[S.tab] || renderPicks;
  $("#main").innerHTML = f();
  const q = $("#q"); if (q) q.oninput = e => { S.q = e.target.value; const pos = e.target.selectionStart; render(); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); };
}
document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-open]");
  if (!t) return;
  if (t.dataset.goto) { S.tab = "board"; store.set("te_tab", S.tab); S.open.add(t.dataset.goto); render();
    const el = document.querySelector(`[data-open="${t.dataset.goto}"]`); el && el.scrollIntoView({ block: "start" }); return; }
  if (t.dataset.tab) { S.tab = t.dataset.tab; store.set("te_tab", S.tab); render(); window.scrollTo(0, 0); return; }
  if (t.dataset.f) { S.f = t.dataset.f; store.set("te_filter", S.f); render(); return; }
  if (t.dataset.open) { S.open.has(t.dataset.open) ? S.open.delete(t.dataset.open) : S.open.add(t.dataset.open); render(); return; }
  if (t.dataset.lc) {
    const m = B.matches.find(x => x.id === t.dataset.lc); const st = m._live; const k = t.dataset.k;
    if (k === "tb") st.tb = !st.tb; else if (k === "srv") st.srv = +t.dataset.v;
    else st[k] = Math.max(0, st[k] + +t.dataset.d);
    if (k === "ga" || k === "gb") st.tb = st.ga === 6 && st.gb === 6;
    render(); return;
  }
  if (t.dataset.log) {
    const tk = t.dataset.log; let pre = null;
    for (const m of B.matches) for (const b of m.bets || []) if (b.ticker === tk) pre = { label: b.label, match: m.names.join(" vs "), price: b.ask, units: b.units || 1, ticker: tk, type: b.kind === "match" ? "Straight" : "Sets/games", where: "Kalshi", strategy: (b.tags || []).map(x => B.config.strategies[x]?.label || x).join(", "), tour: m.tour };
    betForm(pre || {}); return;
  }
  if (t.dataset.logcombo) { const c = JSON.parse(t.dataset.logcombo); betForm({ label: c.legs.join(" + "), match: Array.isArray(c.names[0]) ? c.names.map(n => n.join(" v ")).join(" & ") : c.names.join(" vs "), type: "Combo", where: "Kalshi", price: c.take ? c.take / 100 : null, units: c.legs.length === 2 ? 0.5 : c.legs.length === 3 ? 0.25 : 0.1, strategy: `${c.legs.length}-leg value parlay` }); return; }
  if (t.dataset.logbook) { const f = JSON.parse(t.dataset.logbook); betForm({ label: f.l || `${f.n} to win (${f.b})`, match: f.m, type: f.ty || "Straight", where: "Sportsbook", odds: f.o, units: f.u || 1, ticker: f.t, strategy: f.s || "Sportsbook beats Pinnacle" }); return; }
  if (t.dataset.logfut) { const f = JSON.parse(t.dataset.logfut); betForm({ label: `${f.n} ${f.s === "yes" ? "to win" : "not to win"} ${f.tn}`, match: f.tn, type: "Futures", where: "Kalshi", price: f.s === "yes" ? f.a : 1 - f.b, units: 0.5, ticker: f.t, side: f.s, strategy: "Tournament winner (draw sim)", tour: f.tour }); return; }
  if (t.id === "addbet") return betForm();
  if (t.id === "settings") return settingsForm();
  if (t.id === "ladder") return ladderForm();
  if (t.id === "dlg-x") return $("#dlg").close();
  if (t.id === "export") { const blob = new Blob([JSON.stringify({ bets: bets(), settings: tsettings() })], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "tennis-edge-bets.json"; a.click(); return; }
  if (t.id === "import") { const i = document.createElement("input"); i.type = "file"; i.accept = "application/json"; i.onchange = async () => { try { const d = JSON.parse(await i.files[0].text()); if (Array.isArray(d.bets)) { saveBets(d.bets); if (d.settings) store.set("te_settings", d.settings); render(); } } catch { alert("That file isn't a Tennis Edge backup."); } }; i.click(); return; }
  if (t.dataset.set) { const bs = bets(); const b = bs.find(x => x.id === t.dataset.set); if (b) { b.status = t.dataset.st; b.settled = Date.now(); saveBets(bs); render(); } return; }
  if (t.dataset.del) { if (confirm("Delete this bet?")) { saveBets(bets().filter(x => x.id !== t.dataset.del)); render(); } return; }
});

async function load() {
  try {
    const r = await fetch("board.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const nb = await r.json();
    if (B) nb.matches.forEach(m => { const o = B.matches.find(x => x.id === m.id); if (o && o._live) m._live = o._live; });
    B = nb;
    try { const r2 = await fetch("sportsbook.json?t=" + Date.now(), { cache: "no-store" }); if (r2.ok) SB = await r2.json(); } catch {}
    $("#upd").innerHTML = `Updated <b>${ago(B.generated)}</b><br>${B.n_matches} matches · refreshes ~20 min`;
    render();
  } catch (e) {
    $("#upd").textContent = "Couldn't load the board — retrying";
    if (!B) $("#main").innerHTML = `<div class="card empty" style="margin-top:14px">The board hasn't been generated yet, or you're offline.</div>`;
  }
}
load();
setInterval(load, 5 * 60 * 1000);
setInterval(() => { if (B) $("#upd").innerHTML = `Updated <b>${ago(B.generated)}</b><br>${B.n_matches} matches · refreshes ~20 min`; }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
